name: One-time AI question quality upgrade

on:
  push:
    branches: [main]
    paths:
      - "scripts/apply-stream-quality-upgrade.py"
      - ".github/workflows/one-time-stream-quality-upgrade.yml"

permissions:
  contents: write

jobs:
  upgrade:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify RED then implement and verify GREEN
        run: python3 scripts/apply-stream-quality-upgrade.py

      - name: Full test suite and production build
        run: npm test

      - name: Lint
        run: npm run lint

      - name: Remove one-time migration files
        run: rm -f scripts/apply-stream-quality-upgrade.py .github/workflows/one-time-stream-quality-upgrade.yml

      - name: Commit verified implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "feat: improve AI question streaming and source quality"
          git push origin HEAD:main
